
name: Testes automatizados - Honórias

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes e medir cobertura
        run: |
          python -m pytest tests/ -v --cov=database --cov-report=term-missing
